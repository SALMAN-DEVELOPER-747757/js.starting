<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <h1>Chai aur javaScript</h1>
    <button id="start">start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const sayDate=function(str){
    console.log(str,Date.now());
    }
setInterval(sayDate,1000,'hi')

let intervalId=null;

const startButton = document.getElementById('start');
const stopButton = document.getElementById('stop');

startButton.addEventListener('click', () => {
        // Only start if there isn't a running interval already
        if (intervalId === null) {
            intervalId = setInterval(sayDate, 1000, 'hi');
            console.log("Printing started...");
        }
    });

    stopButton.addEventListener('click', () => {
        if (intervalId !== null) {
            clearInterval(intervalId); // Stops the interval loop
            intervalId = null;        // Resets the variable back to empty
            console.log("Printing stopped.");
        }
    });
</script>
</html>
